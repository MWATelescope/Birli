# Based on https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"
  pull_request:

name: Linux Tests

jobs:
  test:
    strategy:
      matrix:
        os:
          - "ubuntu-22.04"
          - "ubuntu-22.04-arm"
          - "ubuntu-24.04"
        feature_set:
          - "_no_flag"
          - "_aoflagger"
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install cargo-make
        run: |
          cargo install --debug cargo-make

      - name: Install deps
        # if aoflagger not enabled, you only need cfitsio
        run: |
          cargo make install_deps${{ matrix.feature_set }}

      - name: Run tests
        run: |
          cargo make test${{ matrix.feature_set }}
        env:
          LD_LIBRARY_PATH: /usr/local/lib/:/usr/lib/x86_64-linux-gnu/
